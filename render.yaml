services:
  - type: web
    name: projectlens-ai-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && npm install"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: NODE_VERSION
        value: "20.18.0"
      - key: ESLINT_INIT_TIMEOUT_SECONDS
        value: "30"
      - key: ANALYSIS_TIMEOUT_SECONDS
        value: "25"
